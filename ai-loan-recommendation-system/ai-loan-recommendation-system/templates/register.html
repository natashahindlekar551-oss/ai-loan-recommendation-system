{% extends "base.html" %}

{% block title %}Register - LoanAI Recommendation System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="app-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="brand-icon mx-auto mb-3" style="width: 50px; height: 50px; font-size: 1.4rem;">
                        <i class="fa-solid fa-user-plus text-primary"></i>
                    </div>
                    <h3 class="fw-bold tracking-tight mb-1">Create an Account</h3>
                    <p class="text-secondary font-sm">Register to evaluate your loan profile and upload verification documents</p>
                </div>

                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label class="form-label font-sm fw-semibold">Full Name *</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                            <input type="text" name="name" class="form-control" placeholder="e.g. Ramesh Patel" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label font-sm fw-semibold">Email Address *</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                                <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label font-sm fw-semibold">Mobile Number *</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
                                <input type="tel" name="phone" class="form-control" placeholder="9820011223" required>
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label font-sm fw-semibold">Password *</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" minlength="6" required>
                        </div>
                        <small class="text-muted font-xxs">Must be at least 6 characters.</small>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-semibold shadow-sm mb-3">
                        Create Account <i class="fa-solid fa-arrow-right ms-1"></i>
                    </button>
                </form>

                <div class="text-center mt-3 font-sm text-secondary">
                    Already have an account? <a href="{{ url_for('login') }}" class="text-primary fw-semibold text-decoration-none">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
